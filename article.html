<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FactNov - تفاصيل المقال</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <style>
    /* تنسيق خاص بصفحة عرض المقال الكامل */
    .article-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .article-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .article-header h1 {
      font-size: 2.2rem;
      margin: 1rem 0;
      line-height: 1.4;
    }
    .article-meta {
      display: flex;
      justify-content: center;
      gap: 1rem;
      color: var(--text-muted-color, #888);
      font-size: 0.95rem;
    }
    .article-image-wrapper {
      width: 100%;
      max-height: 480px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 2.5rem;
    }
    .article-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .article-body {
      line-height: 1.9;
      font-size: 1.15rem;
      color: var(--text-color);
    }
    .article-body p {
      margin-bottom: 1.5rem;
    }
    .article-body h2 {
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo-wrapper" style="display: flex; align-items: center; gap: 8px;">
        <a href="index.html" class="back-home-btn" aria-label="الرجوع للرئيسية">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(180deg);">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <a href="index.html" class="logo">Fact<span>Nov</span></a>
      </div>
      
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="category.html?category=technology">تقنية</a></li>
          <li><a href="category.html?category=ai">ذكاء اصطناعي</a></li>
          <li><a href="category.html?category=business">مال وأعمال</a></li>
          <li><a href="category.html?category=health">صحة</a></li>
        </ul>
      </nav>
      <div class="controls" style="display: flex; align-items: center; gap: 0.75rem;">
        <button class="btn-icon" id="dark-mode-toggle" aria-label="تغيير المظهر"></button>
        <button class="btn-icon" onclick="location.href='search.html'" aria-label="البحث">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="hamburger" id="hamburger" aria-label="فتح القائمة">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- المقال الرئيسي المفتوح -->
    <article class="article-container">
      <div class="article-header">
        <span id="article-category" class="badge"></span>
        <h1 id="article-title">جاري تحميل المقال...</h1>
        <div class="article-meta">
          <span>الكاتب: <strong id="article-author"></strong></span>
          <span>•</span>
          <span id="article-date"></span>
        </div>
      </div>

      <div class="article-image-wrapper">
        <img id="article-image" src="" alt="" onerror="this.onerror=null; this.src='assets/images/default.webp';">
      </div>

      <!-- هنا كينزل المحتوى الطويل (الـ content) -->
      <div id="article-content" class="article-body"></div>
      <!-- كود الزر الأزرق -->
       <div style="text-align: center; margin: 20px 0;">
      <a href="https://www.effectivecpmnetwork.com/i4g0ebw3?key=a0329c5123ad32edce5af4d7e6124615" 
   target="_blank" 
   style="display: inline-block; background-color: #007bff; color: #ffffff; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; font-family: Arial, sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.3s ease;">
   اضغط هنا للمزيد
</a></div>

    </article>

    <!-- قسم المقالات المشابهة -->
    <section class="related-articles-sec" style="margin-top: 4rem; border-top: 1px solid var(--border-color); padding-top: 2.5rem;">
      <h2 class="section-title" style="margin-bottom: 2rem; font-size: 1.5rem;">مقالات مشابهة قد تهمك</h2>
      <div class="articles-grid" id="related-articles-target">
        <!-- الكروت غادين ينزلوا هنا تلقائياً -->
      </div>
    </section>
  </main>

  <script src="assets/js/articles.js"></script>
  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        const articles = await ArticleEngine.fetchAll();
        const article = articles.find(art => art.id === articleId);

        if (article) {
          document.getElementById('article-title').innerText = article.title;
          document.getElementById('article-category').innerText = article.category;
          document.getElementById('article-image').src = article.image;

          // 1. كود البانر العادي (الفوق والتحت)
          const adCode = `
            <div style="text-align: center; margin: 30px 0;">
               <script>
  atOptions = {
    'key' : '374a60ede88dad103ca5ffb958645647',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/374a60ede88dad103ca5ffb958645647/invoke.js"><\/script>

            </div>
          `;

          // 2. كود الـ Native Banner (الوسط)
          const nativeCode = `
            <div style="text-align: center; margin: 30px 0;">
             <script async="async" data-cfasync="false" src="https://pl30406455.effectivecpmnetwork.com/f1ea70a226eca110d7b804890f40b290/invoke.js"><\/script>
<div id="container-f1ea70a226eca110d7b804890f40b290"></div>

            </div>
          `;

          // منطق الدمج:
          // كنشدو محتوى المقال وكنزيدو عليه الإعلانات بلا ما نغيرو كود الـ HTML ديال الصفحة
          const paragraphs = article.content.split('</p>');
          let finalContent = adCode; // بانر الفوق

          paragraphs.forEach((p, index) => {
            finalContent += p + '</p>';
            // إضافة الـ Native Banner فالوسط بعد الفقرة الثانية
            if (index === 1) {
              finalContent += nativeCode;
            }
          });

          finalContent += adCode; // بانر التحت
          
          // هنا كنحطو المحتوى الجديد (المقال + الإعلانات) في الديف ديالو
          document.getElementById('article-content').innerHTML = finalContent;
        }
      } catch (error) {
        console.error("خطأ أثناء تحميل المقال أو الإعلانات:", error);
      }
    });
</script>

  <footer>
    <div class="container footer-inner" style="display: flex; justify-content: space-between; align-items: center; padding: 2rem 0; border-top: 1px solid var(--border-color); margin-top: 4rem; flex-wrap: wrap; gap: 1rem;">
      <p class="text-muted" style="margin: 0; font-size: 0.9rem; color: var(--text-muted-color, #888);">© 2026 FactNov. جميع الحقوق محفوظة.</p>
      <div class="footer-links" style="display: flex; gap: 1.5rem;">
        <a href="about.html" class="footer-link">من نحن</a>
        <a href="contact.html" class="footer-link">اتصل بنا</a>
        <a href="privacy.html" class="footer-link">سياسة الخصوصية</a>
      </div>
    </div>
  </footer>

  <style>
    /* تنسيق روابط الفوتر */
    .footer-link {
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }
    .footer-link:hover {
      color: var(--primary);
    }
    @media (max-width: 500px) {
      .footer-inner {
        flex-direction: column !important;
        text-align: center;
        justify-content: center !important;
      }
      .footer-links {
        justify-content: center;
      }
    }
  </style>
</body>
</html>
