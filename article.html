<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FactNov - تفاصيل المقال</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .article-container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }
    .article-body { line-height: 1.9; font-size: 1.15rem; color: var(--text-color); }
    .ad-wrapper { text-align: center; margin: 30px 0; min-height: 50px; }
  </style>
</head>
<body>

  <!-- المحتوى ديالك -->
  <main class="container">
    <article class="article-container">
      <h1 id="article-title">جاري تحميل المقال...</h1>
      
      <!-- إعلان بانر الفوق -->
      <div class="ad-wrapper">
        <script>atOptions = {'key' : '374a60ede88dad103ca5ffb958645647', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {}};</script>
        <script src="https://www.highperformanceformat.com/374a60ede88dad103ca5ffb958645647/invoke.js"></script>
      </div>

      <div id="article-content" class="article-body"></div>

      <!-- بلاصة الإعلان الوسطي (Native) -->
      <div id="native-ad-spot" class="ad-wrapper"></div>

      <!-- الزر -->
      <div style="text-align: center; margin: 40px 0;">
        <a href="https://www.effectivecpmnetwork.com/i4g0ebw3?key=a0329c5123ad32edce5af4d7e6124615" 
           style="background-color: #007bff; color: #fff; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold;">
           اضغط هنا للمزيد
        </a>
      </div>
    </article>
  </main>

  <script src="assets/js/articles.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');
      const articles = await ArticleEngine.fetchAll();
      const article = articles.find(art => art.id === articleId);

      if (article) {
        document.getElementById('article-title').innerText = article.title;
        document.getElementById('article-content').innerHTML = article.content;

        // حقن إعلان Native بطريقة آمنة
        const nativeAdSpot = document.getElementById('native-ad-spot');
        const script = document.createElement('script');
        script.src = "https://pl30406455.effectivecpmnetwork.com/f1ea70a226eca110d7b804890f40b290/invoke.js";
        script.setAttribute('data-cfasync', 'false');
        script.async = true;
        
        const container = document.createElement('div');
        container.id = "container-f1ea70a226eca110d7b804890f40b290";
        
        nativeAdSpot.appendChild(script);
        nativeAdSpot.appendChild(container);
      }
    });
  </script>
</body>
</html>
