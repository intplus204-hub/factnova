<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Search | FactNova</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div id="header"></div>



<main class="container">


<h1>
Search Articles
</h1>


<input 
id="searchInput"
placeholder="Search facts..."
style="padding:15px;width:100%;margin:20px 0;">



<div id="results" class="articles-grid"></div>



</main>



<div id="footer"></div>



<script src="js/app.js"></script>


<script>


async function searchArticles(){


const response=
await fetch("data/articles.json");


const articles=
await response.json();



const input=
document.querySelector("#searchInput");



const results=
document.querySelector("#results");



function show(value){


const data=
articles.filter(a=>

a.title.toLowerCase()
.includes(value.toLowerCase())

);



results.innerHTML=data.map(article=>`


<div class="card">


<img src="${article.image}">


<div class="card-content">


<h3>
${article.title}
</h3>


<a class="btn"
href="article.html?id=${article.id}">
Read
</a>


</div>


</div>


`).join("");

}


input.addEventListener(
"input",
()=>show(input.value)
);


show("");

}



searchArticles();


</script>


</body>

</html>
